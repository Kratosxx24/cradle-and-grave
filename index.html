<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cradle and Grave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one framed survey-chart map fills the screen; the figure dossier floats bottom-left (stacks under the map on phones). */
:root {
  --bg: #e9eef0;
  --ink: #17242b;
  --muted: #5b6b73;
  --ocean: #cfdde2;
  --grat: #b7c9cf;
  --land: #f6f7f4;
  --land-hi: #ffffff;
  --border: #9fb0b7;
  --panel: #ffffffee;
  --line: #c9d5da;
  --born: #0b7f72;
  --died: #b8322b;
  --life: #17242b;
  --btn: #17242b;
  --btn-fg: #f6f7f4;
  --display: "Libre Caslon Display", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Work Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1419; --ink: #e4ecee; --muted: #8fa2aa; --ocean: #0f1e26; --grat: #1b313c;
    --land: #23353e; --land-hi: #2b4049; --border: #3f5864; --panel: #13222aee; --line: #2a3f49;
    --born: #3fd1bd; --died: #ff7065; --life: #e4ecee; --btn: #e4ecee; --btn-fg: #0b1419; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1419; --ink: #e4ecee; --muted: #8fa2aa; --ocean: #0f1e26; --grat: #1b313c;
  --land: #23353e; --land-hi: #2b4049; --border: #3f5864; --panel: #13222aee; --line: #2a3f49;
  --born: #3fd1bd; --died: #ff7065; --life: #e4ecee; --btn: #e4ecee; --btn-fg: #0b1419; color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  padding-inline: 16px; padding-block: 12px; box-sizing: border-box;
}
* { box-sizing: border-box; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 10px; max-width: 1500px; margin: 0 auto; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: .01em; }
.brand h1 i { color: var(--muted); font-style: normal; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.tally { display: flex; gap: 20px; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.tally span { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; margin-right: 6px; }

.stage { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--ocean); }
#map { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
#map.revealed { cursor: grab; }
.sphere { fill: var(--ocean); }
.grat { fill: none; stroke: var(--grat); stroke-width: .6; vector-effect: non-scaling-stroke; }
.land { fill: var(--land); }
.border { fill: none; stroke: var(--border); stroke-width: .6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.coast { fill: none; stroke: var(--border); stroke-width: .9; vector-effect: non-scaling-stroke; }
.miss { fill: none; stroke-width: 1.6; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
.miss.b { stroke: var(--born); } .miss.d { stroke: var(--died); }
.life { fill: none; stroke: var(--life); stroke-width: 2; vector-effect: non-scaling-stroke; opacity: .75; }
.pin text { font-family: var(--mono); font-size: 10px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pin.guess circle { fill: var(--panel); stroke-width: 2.5; }
.pin.guess.b circle { stroke: var(--born); } .pin.guess.d circle { stroke: var(--died); }
.pin.guess.b text { fill: var(--born); } .pin.guess.d text { fill: var(--died); }
.pin.real circle { stroke: var(--panel); stroke-width: 2.5; }
.pin.real.b circle { fill: var(--born); } .pin.real.d circle { fill: var(--died); }
.pin.real text { fill: var(--panel); }
.pin .tag { font-family: var(--body); font-size: 12px; font-weight: 600; text-anchor: start; fill: var(--ink); paint-order: stroke; stroke: var(--land-hi); stroke-width: 4px; stroke-linejoin: round; }

.zoomctl { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.zoomctl button { width: 34px; height: 34px; border: 0; background: transparent; color: var(--ink); font: 600 17px var(--mono); cursor: pointer; }
.zoomctl button + button { border-top: 1px solid var(--line); }
.zoomctl button:hover { background: var(--line); }
.hint { position: absolute; top: 12px; left: 12px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; max-width: calc(100% - 80px); }

.card {
  position: absolute; left: 14px; bottom: 14px; width: 360px; max-width: calc(100% - 28px);
  background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 8px;
  padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px #0000001f;
}
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.eyebrow b { font-weight: 600; color: var(--ink); font-family: var(--mono); letter-spacing: 0; }
.who h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 4px 0 4px; text-wrap: balance; }
.who .life-yrs { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot {
  text-align: left; border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px;
  padding: 9px 10px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.slot .k { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.slot .k::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; }
.slot.b .k { color: var(--born); } .slot.d .k { color: var(--died); }
.slot .v { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.slot.active.b { border-color: var(--born); box-shadow: inset 0 0 0 1px var(--born); }
.slot.active.d { border-color: var(--died); box-shadow: inset 0 0 0 1px var(--died); }
.slot:disabled { cursor: default; }
.go {
  border: 0; border-radius: 6px; padding: 12px 14px; background: var(--btn); color: var(--btn-fg);
  font: 600 14px var(--body); cursor: pointer; display: flex; justify-content: space-between; align-items: center;
}
.go:disabled { opacity: .35; cursor: not-allowed; }
.go kbd { font: 11px var(--mono); opacity: .6; }
button:focus-visible { outline: 2px solid var(--born); outline-offset: 2px; }
.results { display: flex; flex-direction: column; gap: 10px; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.res .place { font-weight: 600; min-width: 0; }
.res .place small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .09em; }
.res.b .place small { color: var(--born); } .res.d .place small { color: var(--died); }
.res .pts { font-family: var(--mono); font-weight: 600; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
.res .km { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

.final { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); padding: 16px; }
.sheet { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 26px; display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 40px; margin: 0; }
.big { font-family: var(--mono); font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; }
.big small { font-size: 16px; color: var(--muted); font-weight: 400; }
.rank { color: var(--muted); margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 7px 4px; border-top: 1px solid var(--line); text-align: left; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; border-top: 0; }
td.n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
th.n { text-align: right; }

@media (max-width: 680px) {
  .stage { display: flex; flex-direction: column; border: 0; background: transparent; overflow: visible; }
  #map { flex: 1; min-height: 260px; border: 1px solid var(--line); border-radius: 6px; background: var(--ocean); }
  .card { position: static; width: 100%; max-width: none; margin-top: 10px; box-shadow: none; padding: 14px; gap: 12px; }
  .who h2 { font-size: 28px; }
  .brand p { display: none; }
  .hint { display: none; }
  .app { grid-template-rows: auto 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <h1>Cradle <i>&amp;</i> Grave</h1>
      <p>Pin where they were born, then where they died.</p>
    </div>
    <div class="tally">
      <div><span>Figure</span><b id="roundNo">1 / 5</b></div>
      <div><span>Score</span><b id="total">0</b></div>
    </div>
  </header>

  <div class="stage">
    <svg id="map" aria-label="World map. Click to place a pin."></svg>
    <div class="hint" id="hint">Scroll or pinch to zoom. Drag to pan. Click to drop a pin.</div>
    <div class="zoomctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="zreset" aria-label="Reset view">&#8634;</button>
    </div>

    <div class="card" id="card">
      <div class="who">
        <div class="eyebrow"><span id="desc"></span></div>
        <h2 id="name"></h2>
        <div class="life-yrs" id="years"></div>
      </div>
      <div class="slots" id="slots">
        <button class="slot b" id="slotB"><span class="k">Born</span><span class="v" id="vB">Click the map</span></button>
        <button class="slot d" id="slotD"><span class="k">Died</span><span class="v" id="vD">Not placed</span></button>
      </div>
      <div class="results" id="results" hidden></div>
      <button class="go" id="go" disabled><span id="goLabel">Submit both pins</span><kbd>Enter</kbd></button>
    </div>

    <div class="final" id="final" hidden>
      <div class="sheet">
        <div>
          <div class="eyebrow"><span>Final atlas</span></div>
          <h2>Expedition complete</h2>
        </div>
        <div class="big" id="finalScore">0 <small>/ 50,000</small></div>
        <p class="rank" id="rank"></p>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Figure</th><th class="n">Born off</th><th class="n">Died off</th><th class="n">Points</th></tr></thead>
            <tbody id="ftable"></tbody>
          </table>
        </div>
        <button class="go" id="again"><span>Play 5 more figures</span><kbd>Enter</kbd></button>
      </div>
    </div>
  </div>
</div>

const ROUNDS = 5, MAX = 5000, R_EARTH = 6371;
const W = 960, H = 500;
const $ = id => document.getElementById(id);

// ---------- map ----------
const proj = d3.geoNaturalEarth1().fitExtent([[6, 6], [W - 6, H - 6]], { type: "Sphere" });
const path = d3.geoPath(proj);
const svg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`).attr("preserveAspectRatio", "xMidYMid meet");
const gMap = svg.append("g");
gMap.append("path").datum({ type: "Sphere" }).attr("class", "sphere").attr("d", path);
gMap.append("path").datum(d3.geoGraticule10()).attr("class", "grat").attr("d", path);
const countries = topojson.feature(ATLAS, ATLAS.objects.countries);
gMap.append("g").selectAll("path").data(countries.features).join("path").attr("class", "land").attr("d", path);
gMap.append("path").datum(topojson.mesh(ATLAS, ATLAS.objects.countries, (a, b) => a !== b)).attr("class", "border").attr("d", path);
gMap.append("path").datum(topojson.mesh(ATLAS, ATLAS.objects.countries, (a, b) => a === b)).attr("class", "coast").attr("d", path);
const gLines = gMap.append("g");
const gPins = svg.append("g");

let T = d3.zoomIdentity;
const zoom = d3.zoom().scaleExtent([1, 60]).translateExtent([[0, 0], [W, H]]).clickDistance(6)
  .on("zoom", e => { T = e.transform; gMap.attr("transform", T); drawPins(); });
svg.call(zoom).on("dblclick.zoom", null);
$("zin").onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 2);
$("zout").onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 0.5);
$("zreset").onclick = () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);

// ---------- state ----------
let deck = [], cursor = 0, round = 0, picks = [], results = [];
let guess = { b: null, d: null }, active = "b", revealed = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newGame() {
  if (cursor + ROUNDS > deck.length) { deck = shuffle(POOL.map((_, i) => i)); cursor = 0; }
  picks = deck.slice(cursor, cursor + ROUNDS); cursor += ROUNDS;
  round = 0; results = []; $("final").hidden = true; startRound();
}
const fig = () => POOL[picks[round]];
const ll = p => [p[1], p[0]]; // [lat,lon,...] -> [lon,lat]

function yr(y) { return y < 0 ? `${-y} BC` : `${y}`; }
function lifespan(f) {
  const [b, d] = [f[2], f[3]];
  const s = b < 0 && d > 0 ? `${-b} BC – AD ${d}` : b < 0 ? `${-b} – ${-d} BC` : `${b} – ${d}`;
  return `${s}  ·  aged about ${d - b - (b < 0 && d > 0 ? 1 : 0)}`;
}
function fmtLL(c) { const [lon, lat] = c; return `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? "N" : "S"} ${Math.abs(lon).toFixed(1)}°${lon >= 0 ? "E" : "W"}`; }
const km = (a, b) => d3.geoDistance(a, b) * R_EARTH;
const score = d => d < 25 ? MAX : Math.round(MAX * Math.exp(-d / 1500));
const fmt = n => n.toLocaleString("en-US");
const fmtKm = d => d < 10 ? `${d.toFixed(1)} km` : `${fmt(Math.round(d))} km`;

function startRound() {
  const f = fig();
  guess = { b: null, d: null }; active = "b"; revealed = false;
  $("desc").textContent = f[1];
  $("name").textContent = f[0];
  $("years").textContent = lifespan(f);
  $("roundNo").textContent = `${round + 1} / ${ROUNDS}`;
  $("total").textContent = fmt(results.reduce((s, r) => s + r.pts, 0));
  $("slots").hidden = false; $("results").hidden = true;
  $("map").classList.remove("revealed");
  gLines.selectAll("*").remove();
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
  sync();
}

function sync() {
  for (const k of ["b", "d"]) {
    const el = $(k === "b" ? "slotB" : "slotD");
    el.classList.toggle("active", active === k && !revealed);
    $(k === "b" ? "vB" : "vD").textContent = guess[k] ? fmtLL(guess[k]) : (active === k ? "Click the map" : "Not placed");
  }
  const go = $("go");
  if (revealed) { go.disabled = false; $("goLabel").textContent = round + 1 < ROUNDS ? "Next figure" : "See final score"; }
  else { go.disabled = !(guess.b && guess.d); $("goLabel").textContent = guess.b && guess.d ? "Submit both pins" : guess.b ? "Now pin where they died" : "Pin where they were born"; }
  drawPins();
}

$("slotB").onclick = () => { if (!revealed) { active = "b"; sync(); } };
$("slotD").onclick = () => { if (!revealed) { active = "d"; sync(); } };

svg.on("click", e => {
  if (revealed) return;
  const p = T.invert(d3.pointer(e, svg.node()));
  const c = proj.invert(p);
  if (!c || !isFinite(c[0]) || !isFinite(c[1])) return;
  const back = proj(c);
  if (!back || Math.hypot(back[0] - p[0], back[1] - p[1]) > 1) return; // outside the globe outline
  guess[active] = c;
  if (active === "b" && !guess.d) active = "d";
  sync();
});

function pinData() {
  const f = fig(), out = [];
  if (revealed) {
    out.push({ k: "b", type: "real", c: ll(f[4]), tag: f[4][2] });
    out.push({ k: "d", type: "real", c: ll(f[5]), tag: f[5][2], same: km(ll(f[4]), ll(f[5])) < 30 });
  }
  if (guess.b) out.push({ k: "b", type: "guess", c: guess.b });
  if (guess.d) out.push({ k: "d", type: "guess", c: guess.d });
  return out;
}
function drawPins() {
  const data = pinData();
  const sel = gPins.selectAll("g.pin").data(data, d => d.type + d.k).join(enter => {
    const g = enter.append("g");
    g.append("circle").attr("r", d => d.type === "real" ? 9 : 8);
    g.append("text").attr("class", "glyph").text(d => d.k === "b" ? "B" : "D");
    g.append("text").attr("class", "tag").attr("x", 14).attr("y", 0).attr("dominant-baseline", "central");
    return g;
  });
  sel.attr("class", d => `pin ${d.type} ${d.k}`)
    .attr("transform", d => { const [x, y] = T.apply(proj(d.c)); return `translate(${x},${y + (d.same ? 18 : 0)})`; });
  sel.select(".tag").text(d => d.tag ? (d.same && d.k === "d" ? "" : d.tag) : "");
  sel.sort((a, b) => (a.type === "real") - (b.type === "real"));
}

function reveal() {
  const f = fig(), rb = ll(f[4]), rd = ll(f[5]);
  const db = km(guess.b, rb), dd = km(guess.d, rd);
  const r = { name: f[0], db, dd, pb: score(db), pd: score(dd) };
  r.pts = r.pb + r.pd;
  results.push(r);
  revealed = true;
  $("map").classList.add("revealed");

  gLines.append("path").datum({ type: "LineString", coordinates: [rb, rd] }).attr("class", "life").attr("d", path);
  gLines.append("path").datum({ type: "LineString", coordinates: [guess.b, rb] }).attr("class", "miss b").attr("d", path);
  gLines.append("path").datum({ type: "LineString", coordinates: [guess.d, rd] }).attr("class", "miss d").attr("d", path);

  const res = $("results");
  res.innerHTML = "";
  const row = (k, place, d, pts) => {
    const div = document.createElement("div");
    div.className = `res ${k}`;
    div.innerHTML = `<div class="place"><small>${k === "b" ? "Born" : "Died"}</small></div><div class="pts">+${fmt(pts)}</div><div class="km"></div>`;
    div.querySelector(".place").append(place);
    div.querySelector(".km").textContent = d < 25 ? `${fmtKm(d)} away. Bullseye.` : `${fmtKm(d)} away`;
    res.append(div);
  };
  row("b", f[4][2], db, r.pb);
  row("d", f[5][2], dd, r.pd);
  if (f[6]) { const n = document.createElement("p"); n.className = "note"; n.textContent = "Historians disagree on the exact spot; this uses the most commonly cited location."; res.append(n); }
  $("slots").hidden = true; res.hidden = false;
  $("total").textContent = fmt(results.reduce((s, x) => s + x.pts, 0));
  sync();
  fitTo([guess.b, guess.d, rb, rd]);
}

function fitTo(coords) {
  const pts = coords.map(c => proj(c));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const box = svg.node().getBoundingClientRect();
  // Leave room for the floating card on wide screens.
  const cardW = window.innerWidth > 680 ? 400 / box.width * W : 0;
  const pad = 60;
  const k = Math.max(1, Math.min(14, 0.9 / Math.max((x1 - x0 + pad) / (W - cardW), (y1 - y0 + pad) / H)));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const t = d3.zoomIdentity.translate(W / 2 + cardW / 2, H / 2).scale(k).translate(-cx, -cy);
  svg.transition().duration(900).call(zoom.transform, t);
}

function finish() {
  const total = results.reduce((s, r) => s + r.pts, 0);
  $("finalScore").innerHTML = `${fmt(total)} <small>/ ${fmt(ROUNDS * MAX * 2)}</small>`;
  const pct = total / (ROUNDS * MAX * 2);
  $("rank").textContent = pct > .9 ? "Royal Cartographer. You could have written their obituaries." :
    pct > .75 ? "Master surveyor. Very few pins went astray." :
    pct > .55 ? "Seasoned navigator. Solid sense of who lived where." :
    pct > .35 ? "Apprentice mapmaker. The broad strokes are there." :
    "Lost at sea. Try another five.";
  $("ftable").innerHTML = "";
  for (const r of results) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td></td><td class="n">${fmtKm(r.db)}</td><td class="n">${fmtKm(r.dd)}</td><td class="n">${fmt(r.pts)}</td>`;
    tr.firstChild.textContent = r.name;
    $("ftable").append(tr);
  }
  $("final").hidden = false;
  $("again").focus();
}

$("go").onclick = () => {
  if (!revealed) { if (guess.b && guess.d) reveal(); return; }
  if (round + 1 < ROUNDS) { round++; startRound(); } else finish();
};
$("again").onclick = newGame;
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName === "BUTTON") return;
  if (!$("final").hidden) newGame(); else if (!$("go").disabled) $("go").click();
});

// Keep progress across live page updates.
window.claude?.hot?.snapshot?.(() => ({ deck, cursor, round, picks, results }));
const start = data => {
  if (data && data.picks && data.picks.length) {
    ({ deck, cursor, round, picks, results } = data);
    startRound();
  } else newGame();
};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
